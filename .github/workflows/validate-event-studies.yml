name: Validate event studies

on:
  workflow_dispatch:
  push:
    branches:
      - audit/contrast-reliability-20260831
      - signal-quality-review
    paths:
      - '*.js'
      - '*.css'
      - 'scripts/**'
      - 'tests/**'
      - 'data/event_studies.json'
      - 'data/global_liquidity.json'
      - 'data/stocktwits_sentiment.json'
      - 'index.html'
      - '.github/workflows/validate-event-studies.yml'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: event-study-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: JavaScript syntax - full active dashboard bundle
        run: |
          for f in app.js premium.js daily.js strategist.js indicator-commentary.js strategist-daily.js mobile.js guide.js options-risk.js signal-quality.js williams-review.js daily-experience.js agency-hero.js history-intelligence.js session-order.js investor-language.js historical-forward-returns.js tactical-summary.js actionable-summary.js historical-priority.js breadth-cycle.js; do
            node --check "$f"
          done
      - name: Python syntax - market signal updaters
        run: python -m py_compile scripts/update_options_risk.py scripts/update_global_liquidity.py scripts/update_stocktwits_sentiment.py
      - name: Unit tests
        run: python -m unittest tests/test_event_studies.py -v
      - name: Build breadth-cycle context
        run: python scripts/update_breadth_cycle.py
      - name: Generate historical studies with transient-data retry
        run: |
          for attempt in 1 2 3; do
            python scripts/update_event_studies.py && break
            echo "Historical data attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
          for attempt in 1 2 3; do
            python scripts/append_mmfd_event_studies.py && break
            echo "One-week participation study attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
          for attempt in 1 2 3; do
            python scripts/append_breadth_cycle_event_studies.py && exit 0
            echo "Breadth-cycle study attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          exit 1
      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/event_studies.json').read_text())
          m=json.loads(Path('data/market_context.json').read_text())
          assert p['studies'], 'no studies generated'
          assert 'methodology' in p
          assert p['coverage']['SPY']['sessions'] > 5000
          assert p['coverage']['QQQ']['sessions'] > 5000
          assert len(p['studies']) >= 80
          assert 'one_week_participation' in p['methodology']
          assert 'breadth_cycle' in p['methodology']
          assert m.get('breadth_cycle',{}).get('technical_name') == 'McClellan-style Breadth Momentum'
          assert isinstance(m.get('sector_leadership'), list)
          mmfd=[s for s in p['studies'] if s.get('category')=='One-week participation']
          cycle=[s for s in p['studies'] if s.get('category')=='Breadth cycle']
          assert mmfd, 'no one-week participation studies generated'
          assert cycle, 'no breadth-cycle studies generated'
          for s in p['studies']:
              assert s['definition']['rule']
              assert '5' in s['horizons'] and '21' in s['horizons']
              assert s['horizons']['5']['baseline']['n'] > 0
              assert s['horizons']['5']['signal']['n'] <= s['historical_sample']
          print('studies', len(p['studies']), 'mmfd', len(mmfd), 'breadth_cycle', len(cycle), 'current_events', len(p['current_events']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: event-study-validation
          path: |
            data/event_studies.json
            data/market_context.json
          retention-days: 7

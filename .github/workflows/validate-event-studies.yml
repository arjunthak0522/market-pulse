name: Validate event studies

on:
  workflow_dispatch:
  push:
    branches:
      - audit/contrast-reliability-20260831
    paths:
      - '*.js'
      - '*.css'
      - 'scripts/**'
      - 'tests/**'
      - 'data/event_studies.json'
      - 'index.html'
      - '.github/workflows/validate-event-studies.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: JavaScript syntax - full active dashboard bundle
        run: |
          for f in app.js premium.js daily.js strategist.js indicator-commentary.js strategist-daily.js mobile.js guide.js options-risk.js history-intelligence.js session-order.js investor-language.js historical-forward-returns.js; do
            node --check "$f"
          done
      - name: Unit tests
        run: python -m unittest tests/test_event_studies.py -v
      - name: Generate historical studies
        run: python scripts/update_event_studies.py
      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/event_studies.json').read_text())
          assert p['studies'], 'no studies generated'
          assert 'methodology' in p
          assert p['coverage']['SPY']['sessions'] > 5000
          assert p['coverage']['QQQ']['sessions'] > 5000
          assert len(p['studies']) >= 80
          for s in p['studies']:
              assert s['definition']['rule']
              assert '5' in s['horizons'] and '21' in s['horizons']
              assert s['horizons']['5']['baseline']['n'] > 0
              assert s['horizons']['5']['signal']['n'] <= s['historical_sample']
          print('studies', len(p['studies']), 'current_events', len(p['current_events']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: event-study-validation
          path: data/event_studies.json
          retention-days: 7

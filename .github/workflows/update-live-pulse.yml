name: Update Live Pulse

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 13-21 * * 1-5'

permissions:
  contents: write

jobs:
  update-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_intraday.py
      - name: Publish live feed without rebuilding Pages
        shell: bash
        run: |
          if [ ! -f data/live.json ]; then
            echo "No open-market update; nothing to publish."
            exit 0
          fi
          cp data/live.json /tmp/live.json
          rm -f data/live.json
          git fetch origin live-data
          git checkout live-data
          mkdir -p data
          cp /tmp/live.json data/live.json
          git config user.name "market-pulse-bot"
          git config user.email "market-pulse-bot@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Live Pulse data"
          git push origin live-data

name: Update market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update-market-data.yml'
  schedule:
    - cron: '30 22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_market.py
      - name: Commit refreshed data
        run: |
          git config user.name "market-pulse-bot"
          git config user.email "market-pulse-bot@users.noreply.github.com"
          git add data/market_context.json data/history.json
          git diff --cached --quiet && exit 0
          git commit -m "Update market dashboard data"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

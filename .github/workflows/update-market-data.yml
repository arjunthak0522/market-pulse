name: Update market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update-market-data.yml'
  schedule:
    - cron: '30 22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_market.py
      - run: python scripts/update_options_risk.py
      - name: Update historical event studies with transient-data retry
        run: |
          for attempt in 1 2 3; do
            python scripts/update_event_studies.py && break
            echo "Historical data attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
          for attempt in 1 2 3; do
            python scripts/append_mmfd_event_studies.py && exit 0
            echo "One-week participation study attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          exit 1
      - name: Commit refreshed data
        run: |
          cp data/market_context.json /tmp/market_context.json
          cp data/history.json /tmp/history.json
          cp data/event_studies.json /tmp/event_studies.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/market_context.json data/market_context.json
          cp /tmp/history.json data/history.json
          cp /tmp/event_studies.json data/event_studies.json
          git config user.name "market-pulse-bot"
          git config user.email "market-pulse-bot@users.noreply.github.com"
          git add data/market_context.json data/history.json data/event_studies.json
          git diff --cached --quiet && exit 0
          git commit -m "Update market dashboard data"
          git push origin HEAD:main

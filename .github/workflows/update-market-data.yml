name: Update market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-market-data.yml'
  schedule:
    # GitHub cron is UTC. Run both UTC possibilities and gate by America/Chicago
    # so the 4 PM Central hour proceeds across DST changes. GitHub scheduled jobs
    # can start several minutes late, so never require an exact 16:30 timestamp.
    - cron: '30 21 * * 1-5'
    - cron: '30 22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Gate end-of-day run to Central time
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding with manual end-of-day refresh at $(TZ=America/Chicago date)"
            exit 0
          fi
          ct_hour=$(TZ=America/Chicago date +%H)
          if [ "$ct_hour" = "16" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding with end-of-day refresh at $(TZ=America/Chicago date)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping non-4-PM-Central run at $(TZ=America/Chicago date)"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - if: steps.gate.outputs.run == 'true'
        run: python scripts/update_market.py
      - name: Update options risk with end-of-day retry
        if: steps.gate.outputs.run == 'true'
        run: |
          for attempt in 1 2 3 4; do
            python scripts/update_options_risk.py && break
            echo "Options-risk attempt $attempt not aligned yet"
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 30)); fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
          done
      - if: steps.gate.outputs.run == 'true'
        run: python scripts/update_breadth_cycle.py
      - name: Update historical event studies with transient-data retry
        if: steps.gate.outputs.run == 'true'
        run: |
          for attempt in 1 2 3; do
            python scripts/update_event_studies.py && break
            echo "Historical data attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
          for attempt in 1 2 3; do
            python scripts/append_mmfd_event_studies.py && break
            echo "One-week participation study attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
          for attempt in 1 2 3; do
            python scripts/append_breadth_cycle_event_studies.py && break
            echo "Breadth-cycle study attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
          for attempt in 1 2 3; do
            python scripts/append_current_close_conditions_runner.py && break
            echo "Current-close condition study attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
      - name: Commit refreshed data
        if: steps.gate.outputs.run == 'true'
        run: |
          cp data/market_context.json /tmp/market_context.json
          cp data/history.json /tmp/history.json
          cp data/event_studies.json /tmp/event_studies.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/market_context.json data/market_context.json
          cp /tmp/history.json data/history.json
          cp /tmp/event_studies.json data/event_studies.json
          git config user.name "market-pulse-bot"
          git config user.email "market-pulse-bot@users.noreply.github.com"
          git add data/market_context.json data/history.json data/event_studies.json
          git diff --cached --quiet && exit 0
          git commit -m "Update market dashboard data"
          git push origin HEAD:main

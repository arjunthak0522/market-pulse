name: Deploy Market Pulse CEO preview
on:
  workflow_dispatch:
  push:
    branches: [market-pulse-clean-review]
    paths:
      - 'cloudflare/**'
      - 'index.html'
      - 'pulse-v5.css'
      - 'pulse-v5.js'
      - 'market-regime.css'
      - 'market-regime.js'
      - 'event-intelligence.css'
      - 'event-intelligence.js'
      - 'live-ui.js'
      - 'data/**'
      - '.assetsignore'
      - '.github/workflows/deploy-ceo-preview.yml'
permissions:
  contents: read
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Wrangler outside repository assets
        run: |
          mkdir -p /tmp/wrangler
          cd /tmp/wrangler
          npm init -y
          npm install wrangler@4.128.0
      - name: Deploy isolated temporary CEO preview
        working-directory: cloudflare
        run: |
          rm -rf ../node_modules
          set +e
          /tmp/wrangler/node_modules/.bin/wrangler deploy --config wrangler.preview.toml --temporary
          first_rc=$?
          set -e
          if [ "$first_rc" -ne 0 ]; then
            echo "Initial temporary route creation failed; retrying after propagation delay."
            sleep 12
            /tmp/wrangler/node_modules/.bin/wrangler deploy --config wrangler.preview.toml --temporary
          fi

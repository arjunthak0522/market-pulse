name: Refresh seven signals

# Buyer-ready contract v2
on:
  workflow_dispatch:
  push:
    branches: [signal-quality-review]
    paths:
      - 'scripts/update_extremes.py'
      - 'scripts/run_refresh.py'
      - 'requirements.txt'
      - '.github/workflows/refresh-signals.yml'

permissions:
  contents: write

concurrency:
  group: refresh-seven-signals
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: signal-quality-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build buyer-ready market state and studies
        run: |
          set -o pipefail
          python -u scripts/run_refresh.py 2>&1 | tee refresh.log
      - name: Hard product data contract
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee contract.log
          import json
          from pathlib import Path
          p=json.loads(Path('data/signal_data.json').read_text())
          required={'cpce','namo','nymo','trin','trinq','newlows','breadth','vol'}
          assert required == set(p['signals']), (required, set(p['signals']))
          assert p.get('market_state',{}).get('name'), 'missing market state'
          dims=p['market_state'].get('dimensions',{})
          assert {'fear','internals','capitulation'} <= set(dims), 'missing pressure-map dimensions'
          setup=p['market_state'].get('setup',{})
          assert {'extreme','confirmation','trigger'} <= set(setup), 'missing setup framework'
          assert p.get('what_changed'), 'missing What Changed feed'
          for name,row in p['signals'].items():
              primary=row.get('value', row.get('above_5d', row.get('vix')))
              assert primary is not None, f'{name}: no current value'
              study=row.get('study')
              assert study and study.get('horizons'), f'{name}: no study'
              assert study.get('episode_method'), f'{name}: study not episode-based'
              assert all(str(h) in study['horizons'] for h in (5,10,21,60)), f'{name}: missing horizon'
              for h in (5,10,21,60):
                  st=study['horizons'][str(h)]
                  n=int(st.get('n',0))
                  assert n >= 5, f'{name}: {h}d study too thin (n={n})'
                  assert 'median_max_drawdown' in st, f'{name}: {h}d missing path drawdown'
                  assert 'median_max_favorable' in st, f'{name}: {h}d missing favorable excursion'
          vol=p['signals']['vol']
          for key in ('term_study','vvix_study','skew_study'):
              st=vol.get(key)
              assert st and st.get('episode_method'), f'vol: missing {key}'
              assert all(str(h) in st.get('horizons',{}) for h in (5,10,21,60)), f'vol: {key} missing horizon'
          print('buyer-ready Market Pulse contract passed')
          PY
      - name: Upload refresh diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-signal-refresh-diagnostic
          path: |
            refresh.log
            contract.log
            data/signal_data.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Commit refreshed static dataset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/signal_data.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh buyer-ready Market Pulse dataset'
          git pull --rebase origin signal-quality-review
          git push origin HEAD:signal-quality-review

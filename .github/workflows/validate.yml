name: Validate clean Market Pulse
on:
  workflow_dispatch:
  push:
    branches: [signal-quality-review, market-regime-v1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: JavaScript syntax
        run: |
          node --check pulse-v5.js
          node --check market-regime.js
          node --check live-ui.js
          node --check cloudflare/worker.js
      - name: Python syntax
        run: python -m py_compile scripts/update_extremes.py scripts/run_refresh.py scripts/live_refresh.py scripts/trace_stockcharts.py scripts/market_regime.py scripts/market_events.py scripts/event_sources.py scripts/event_sources_v2.py scripts/market_context_sources.py scripts/run_event_intelligence.py scripts/regime_history_sanity.py tests/test_extremes.py tests/test_market_regime.py tests/test_market_events.py tests/test_event_sources.py
      - name: Unit tests
        run: python -m unittest tests/test_extremes.py tests/test_market_regime.py tests/test_market_events.py tests/test_event_sources.py -v
      - name: Live free-source smoke test
        run: |
          python scripts/event_sources_v2.py
          python scripts/market_context_sources.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/event_inputs.json').read_text())
          expected={'credit','rates','cross_asset','liquidity','macro_calendar','earnings'}
          got=set(p.get('event_inputs') or {})
          missing=expected-got
          assert not missing, f'event providers unavailable: {sorted(missing)} errors={p.get("errors")}'
          for name,row in p['event_inputs'].items():
              assert row.get('score') is not None, f'{name}: missing normalized score'
              assert row.get('source'), f'{name}: missing source provenance'
              assert row.get('as_of'), f'{name}: missing as_of'

          m=json.loads(Path('data/event_market_context.json').read_text())
          assert m.get('context',{}).get('market_date'), f'market context unavailable: {m.get("error")}'
          assert m.get('context',{}).get('sector_leadership'), 'same-session sector leadership missing'
          assert set((m.get('context',{}).get('etfs') or {})) == {'SPY','QQQ'}, 'SPY/QQQ technical context missing'
          print('all free event providers passed:', sorted(got), 'market_context=', m['context']['market_date'])
          PY
      - name: Partial historical regime sanity
        run: python scripts/regime_history_sanity.py
      - name: Apply regime and event intelligence to current committed dataset
        run: |
          python scripts/market_regime.py
          python scripts/run_event_intelligence.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/signal_data.json').read_text())
          r=p.get('market_regime') or {}
          assert r.get('name'), 'missing official regime'
          assert r.get('confidence') in {'HIGH','MODERATE','LOW'}, 'invalid confidence'
          assert r.get('coverage',{}).get('core_total') == 3, 'unexpected core coverage contract'
          assert set((r.get('buckets') or {})) == {'trend','breadth','volatility'}, 'missing regime bucket'
          assert r.get('stability',{}).get('rule'), 'missing hysteresis rule'
          assert r.get('sessions_in_regime',0) >= 1, 'invalid regime duration'

          e=p.get('market_events') or {}
          expected={'trend','breadth','volatility','credit','rates','leadership','cross_asset','sentiment','positioning_options','macro_calendar','liquidity','earnings','technical_extremes'}
          assert set((e.get('families') or {})) == expected, 'event-family contract incomplete'
          assert e.get('coverage',{}).get('total') == len(expected), 'event coverage total incorrect'
          assert e.get('coverage',{}).get('available') == len(expected), f'not all event families are live: {e.get("coverage")}'
          for name,row in e['families'].items():
              assert row.get('status') == 'available', f'{name}: expected live provider but got {row.get("status")}'
              assert row.get('score') is not None, f'{name}: available family missing score'
              assert row.get('as_of'), f'{name}: available family missing as_of'
          assert Path('data/event_history.json').exists(), 'missing event history store'
          print('current dataset regime:', r['name'], r['confidence'])
          print('event coverage:', e['coverage']['available'], '/', e['coverage']['total'])
          print('top events:', [(x['family'], x['importance']) for x in e.get('top_events',[])])
          PY
      - name: Clean premium Market Pulse guard
        run: |
          python - <<'PY'
          from pathlib import Path
          allowed={'README.md','index.html','pulse-v5.css','pulse-v5.js','market-regime.css','market-regime.js','live-ui.js','manifest.webmanifest','requirements.txt','.assetsignore','wrangler.toml'}
          roots={p.name for p in Path('.').iterdir() if p.is_file()}
          extras=roots-allowed
          assert not extras, f'unexpected root product files: {sorted(extras)}'

          html=Path('index.html').read_text()
          assert html.count('<script ')==3, 'expected V5 app, regime engine and live-data overlay'
          assert 'pulse-v5.js' in html and 'market-regime.js' in html and 'live-ui.js' in html
          assert 'market-pulse-live-endpoint' in html, 'missing configurable live endpoint'
          assert 'content="/api/live"' in html, 'dashboard must use same-origin /api/live'
          assert html.count('stylesheet')==2 and 'pulse-v5.css' in html and 'market-regime.css' in html
          required=['command-center','MARKET PULSE','MARKET PRESSURE','CORE READ','SINCE THE LAST READ','What changed','WHAT MATTERS NOW','Signals lighting up']
          for text in required:
              assert text in html, f'missing premium product hierarchy: {text}'
          for legacy in ['market-core','change-section','regime-panel','What matters underneath the market','TURNING-POINT FRAMEWORK']:
              assert legacy not in html, f'legacy stacked dashboard hierarchy still present: {legacy}'
          for ident in ['stateName','stateSummary','pressureMap','regimeName','regimeConfidence','regimeInterpretation','regimeMeta','regimeBuckets','changedList','signalBoard']:
              assert f'id="{ident}"' in html, f'missing required rendering target: {ident}'

          css=Path('pulse-v5.css').read_text()
          for text in ['.command-center','.command-title','.command-change-wrap','.signal-module.normal{opacity:.68','--cyan:#71d7ff','@media(max-width:680px)']:
              assert text in css, f'missing premium/mobile visual behavior: {text}'
          assert '--violet:' not in css, 'decorative purple token should not drive premium UI'

          js=Path('pulse-v5.js').read_text()
          for text in ['View historical study','data-watch','median_max_drawdown','median_max_favorable','STANDS OUT']:
              assert text in js, f'missing V5 behavior: {text}'
          assert 'weight = {severe:0,extreme:1,watch:2,normal:3}' in js, 'signal priority ordering missing'

          regime_js=Path('market-regime.js').read_text()
          for text in ['regimeName','regimeConfidence','Trend','Breadth','Volatility','core buckets']:
              assert text in regime_js, f'missing regime UI behavior: {text}'

          regime_py=Path('scripts/market_regime.py').read_text()
          for text in ['Risk-On Expansion','Risk-On Narrowing','Transition / Mixed','Volatility Shock','Risk-Off','Recovery / Re-Risking','two completed sessions']:
              assert text in regime_py, f'missing regime classifier behavior: {text}'

          events_py=Path('scripts/market_events.py').read_text()
          for text in ['credit','rates','leadership','cross_asset','sentiment','positioning_options','macro_calendar','liquidity','earnings','technical_extremes','Unavailable families never receive synthetic values']:
              assert text in events_py, f'missing event-intelligence foundation: {text}'

          sources=(Path('scripts/event_sources.py').read_text()+Path('scripts/event_sources_v2.py').read_text()+Path('scripts/market_context_sources.py').read_text())
          for text in ['BAMLH0A0HYM2','BAMLC0A0CM','DGS2','DGS10','T10Y2Y','DTWEXBGS','DCOILWTICO','NASDAQQGLDI','NFCI','WALCL','RRPONTSYD','WTREGEN','ALFRED','NASDAQ_EARNINGS','SPY','QQQ','XLK','XLE']:
              assert text in sources, f'missing free source adapter: {text}'

          live=Path('live-ui.js').read_text()
          for text in ['POLL_MS = 5 * 60_000','intraday_extreme_occurred','SESSION CLOSE','~5 MIN','market-pulse-live-endpoint']:
              assert text in live, f'missing live-data behavior: {text}'

          relay=Path('cloudflare/worker.js').read_text()
          for text in ['/api/live','/api/health','env.ASSETS.fetch','$TRIN','$TRINQ','$NYADV','$NAADV','$VIX3M','refresh_guidance_seconds','StockCharts QuoteBrain']:
              assert text in relay, f'missing unified Worker contract: {text}'

          wrangler=Path('cloudflare/wrangler.toml').read_text()
          for text in ['name = "market-pulse"','binding = "ASSETS"','directory = "../"','run_worker_first = ["/api/*"]']:
              assert text in wrangler, f'missing unified Wrangler contract: {text}'

          ignore=Path('.assetsignore').read_text()
          for text in ['.github/','cloudflare/','scripts/','tests/']:
              assert text in ignore, f'non-public source not excluded from static assets: {text}'

          assert not Path('netlify/functions/live-market.mts').exists(), 'Netlify relay must remain removed'
          print('premium Market Pulse + Regime + Event Intelligence guard passed')
          PY